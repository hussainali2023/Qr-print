<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cafe print · auto QR station</title>
    <!-- QR code generation library (qrcode.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #1e2b3c 0%, #0f1a26 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            color: #eaf0f8;
        }
        .app-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            align-items: flex-start;
        }
        /* ---------- CUSTOMER PANEL (QR + upload) ---------- */
        .customer-panel {
            background: #1d2c3a;
            border-radius: 48px;
            padding: 28px 24px 32px 24px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 255, 255, 0.08);
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #3e5568;
        }
        .panel-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9fb8cf;
            margin-bottom: 18px;
            font-weight: 500;
            text-shadow: 0 2px 4px black;
        }
        .qr-wrapper {
            background: #eef3f7;
            padding: 16px;
            border-radius: 36px;
            box-shadow: inset 0 0 0 2px #a0b8cc, 0 12px 24px rgba(0, 0, 0, 0.6);
            margin-bottom: 22px;
        }
        #qrcode {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img, #qrcode canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 16px;
            display: block;
        }
        .qr-hint {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8ba3ba;
            margin-bottom: 18px;
        }
        .file-upload-area {
            width: 100%;
            background: #11212e;
            border-radius: 32px;
            padding: 16px;
            border: 2px dashed #3f5d74;
            transition: 0.15s;
            text-align: center;
            cursor: pointer;
            margin-bottom: 18px;
        }
        .file-upload-area:hover {
            border-color: #7fa7c7;
            background: #172c3b;
        }
        .file-upload-area label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #b7d0e8;
            font-weight: 500;
        }
        .file-upload-area input[type="file"] {
            display: none;
        }
        .upload-icon {
            font-size: 2rem;
            filter: drop-shadow(0 4px 6px black);
        }
        .file-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f1e29;
            border-radius: 60px;
            padding: 8px 16px 8px 12px;
            margin: 12px 0 6px;
            width: 100%;
            justify-content: space-between;
        }
        .file-preview span {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
            color: #d2e5fc;
        }
        .file-preview img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 8px;
            background: #ffffff20;
        }
        .settings-row {
            display: flex;
            width: 100%;
            gap: 16px;
            margin: 12px 0 16px;
            flex-wrap: wrap;
        }
        .setting-group {
            flex: 1;
            background: #0e1b26;
            border-radius: 40px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: inset 0 2px 5px #030a0f;
            border: 1px solid #2b4052;
        }
        .setting-group label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #9bb3cc;
            font-weight: 600;
        }
        .setting-group select {
            background: #1d3141;
            border: none;
            padding: 8px 12px;
            border-radius: 30px;
            color: #e3f0ff;
            font-weight: 500;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            border: 1px solid #3b5a73;
        }
        .btn-primary {
            background: #2a4b64;
            border: none;
            padding: 14px 30px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: #e6f2ff;
            cursor: pointer;
            box-shadow: 0 7px 0 #0f1a22, 0 10px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.07s ease;
            letter-spacing: 0.5px;
            width: 100%;
            text-transform: uppercase;
            margin-top: 8px;
            border: 1px solid #487497;
        }
        .btn-primary:active {
            transform: translateY(6px);
            box-shadow: 0 1px 0 #0f1a22, 0 6px 14px black;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #0f1a22;
            pointer-events: none;
        }
        /* ---------- OWNER PANEL (print station) ---------- */
        .owner-panel {
            background: #1d2c3a;
            border-radius: 48px;
            padding: 28px 24px 28px 24px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 255, 255, 0.08);
            width: 500px;
            border: 1px solid #3e5568;
            display: flex;
            flex-direction: column;
        }
        .owner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 6px;
        }
        .owner-header h2 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #b8d0e7;
            font-weight: 500;
            text-shadow: 0 2px 4px black;
        }
        .badge {
            background: #1e3b4f;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #b0d3f0;
            border: 1px solid #496c85;
        }
        .queue-area {
            background: #0c1922;
            border-radius: 32px;
            padding: 18px 16px;
            min-height: 260px;
            max-height: 340px;
            overflow-y: auto;
            box-shadow: inset 0 0 0 1px #253c4c, inset 0 6px 12px #02080e;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .queue-empty {
            color: #5f7b92;
            text-align: center;
            font-style: italic;
            margin: auto 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }
        .print-job {
            background: #132837;
            border-radius: 24px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 6px solid #2c7da0;
            box-shadow: 0 6px 12px #00000040;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .job-thumb {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #1e3343;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid #2f5168;
            overflow: hidden;
        }
        .job-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .job-details {
            flex: 1;
        }
        .job-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e1f0ff;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .job-meta {
            font-size: 0.75rem;
            display: flex;
            gap: 12px;
            color: #9bbad9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .job-status {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 40px;
            background: #1e4b3e;
            color: #b7f0d9;
            font-weight: 600;
            white-space: nowrap;
        }
        .job-status.printing {
            background: #4a3e1b;
            color: #ffecb3;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .print-log {
            margin-top: 18px;
            background: #0c1922;
            border-radius: 20px;
            padding: 14px 16px;
            font-size: 0.8rem;
            color: #aec9e2;
            border: 1px solid #2b4153;
            max-height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 2px 5px black;
        }
        .log-entry {
            color: #8fc1e0;
            padding: 2px 0;
            border-bottom: 1px solid #1e3343;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mt-2 { margin-top: 8px; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- CUSTOMER PANEL (QR + file send) -->
    <div class="customer-panel">
        <div class="panel-title">📱 scan & send</div>
        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>
        <div class="qr-hint">⇩ scan with phone camera</div>

        <!-- file selection & preview -->
        <div class="file-upload-area" id="dropZone">
            <label for="fileInput">
                <span class="upload-icon">📎</span>
                <span>tap to choose file</span>
            </label>
            <input type="file" id="fileInput" accept="image/*,application/pdf,text/plain">
        </div>
        <div class="file-preview" id="filePreview" style="display: none;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="previewImg" src="#" alt="preview" style="display: none;">
                <span id="fileName">—</span>
            </div>
            <span style="color:#6a8ba5; cursor:pointer;" id="clearFileBtn">✕</span>
        </div>

        <!-- print settings -->
        <div class="settings-row">
            <div class="setting-group">
                <label>🎨 color</label>
                <select id="colorMode">
                    <option value="color">Color</option>
                    <option value="bw">B&W</option>
                </select>
            </div>
            <div class="setting-group">
                <label>📏 size</label>
                <select id="paperSize">
                    <option value="A4">A4</option>
                    <option value="A5">A5</option>
                    <option value="Letter">Letter</option>
                </select>
            </div>
        </div>

        <button class="btn-primary" id="sendToPrintBtn" disabled>🖨️ send to print</button>
    </div>

    <!-- OWNER PANEL (print queue + auto print simulation) -->
    <div class="owner-panel">
        <div class="owner-header">
            <h2>☕ owner station</h2>
            <div class="badge">auto-print ON</div>
        </div>
        <div class="queue-area" id="printQueue">
            <div class="queue-empty">— no print jobs —</div>
        </div>
        <div class="print-log" id="printLog">
            <div class="log-entry">📡 waiting for incoming files...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM elements ----------
        const qrcodeDiv = document.getElementById('qrcode');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const filePreview = document.getElementById('filePreview');
        const fileNameSpan = document.getElementById('fileName');
        const previewImg = document.getElementById('previewImg');
        const clearFileBtn = document.getElementById('clearFileBtn');
        const sendBtn = document.getElementById('sendToPrintBtn');
        const colorModeSelect = document.getElementById('colorMode');
        const paperSizeSelect = document.getElementById('paperSize');
        const printQueue = document.getElementById('printQueue');
        const printLog = document.getElementById('printLog');

        // ---------- state ----------
        let currentFile = null;            // stores selected file data { file, dataUrl, name, type }
        let isPrintingLock = false;        // simple lock for auto-print simulation

        // ---------- 1. Generate QR code pointing to "upload" endpoint (simulated) ----------
        // For demo, QR encodes a URL that could be used on a phone; in real life it would open a mobile upload page.
        // Here it's just for visual and plausibility.
        const qrData = 'https://cafe-print.local/upload?session=' + Math.random().toString(36).substring(2, 10);
        new QRCode(qrcodeDiv, {
            text: qrData,
            width: 200,
            height: 200,
            colorDark: "#0b1a24",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // ---------- 2. File selection & preview ----------
        function handleFileSelect(file) {
            if (!file) return;
            // basic validation
            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf', 'text/plain'];
            if (!validTypes.includes(file.type) && !file.type.startsWith('image/')) {
                addLog('⚠️ unsupported file type, please choose image or PDF');
                return;
            }
            // read preview if image
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                currentFile = {
                    file: file,
                    dataUrl: dataUrl,
                    name: file.name,
                    type: file.type
                };
                // update UI
                fileNameSpan.textContent = file.name;
                if (file.type.startsWith('image/')) {
                    previewImg.src = dataUrl;
                    previewImg.style.display = 'block';
                } else {
                    previewImg.style.display = 'none';
                }
                filePreview.style.display = 'flex';
                sendBtn.disabled = false;
            };
            if (file.type.startsWith('image/')) {
                reader.readAsDataURL(file);
            } else {
                // for non-image, we still store the file, but no preview image
                currentFile = {
                    file: file,
                    dataUrl: null,
                    name: file.name,
                    type: file.type
                };
                fileNameSpan.textContent = file.name;
                previewImg.style.display = 'none';
                filePreview.style.display = 'flex';
                sendBtn.disabled = false;
            }
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // drag & drop (bonus)
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#7fa7c7';
            dropZone.style.background = '#172c3b';
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#3f5d74';
            dropZone.style.background = '#11212e';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#3f5d74';
            dropZone.style.background = '#11212e';
            const file = e.dataTransfer.files[0];
            if (file) handleFileSelect(file);
        });

        // clear selected file
        clearFileBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            filePreview.style.display = 'none';
            previewImg.src = '#';
            sendBtn.disabled = true;
        });

        // ---------- 3. Helper: add log entry ----------
        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.textContent = `[${time}] ${message}`;
            printLog.prepend(entry); // newest at top
            if (printLog.children.length > 8) {
                printLog.removeChild(printLog.lastChild);
            }
        }

        // ---------- 4. Send file to owner (simulate auto-print) ----------
        function sendToPrint() {
            if (!currentFile || !currentFile.file) {
                addLog('⚠️ no file selected');
                return;
            }

            // get settings
            const colorMode = colorModeSelect.value; // 'color' or 'bw'
            const paperSize = paperSizeSelect.value;

            // Prepare job object
            const job = {
                id: Date.now() + Math.random(),
                fileName: currentFile.name,
                fileType: currentFile.type,
                dataUrl: currentFile.dataUrl,
                color: colorMode,
                size: paperSize,
                status: 'queued',
                timestamp: new Date()
            };

            // Add to queue (owner panel)
            addJobToQueue(job);
            addLog(`📨 received: ${job.fileName} (${colorMode}, ${paperSize})`);

            // simulate auto-print: after short delay, mark as printing then printed
            simulateAutoPrint(job);

            // ** important: also auto-print a copy for the user (as requested) **
            // In a real app this would trigger the user's printer. We simulate a "copy printed" notification.
            setTimeout(() => {
                addLog(`🖨️ auto-copy printed for user: ${job.fileName}`);
            }, 400);

            // clear selection after sending (optional)
            // we keep it for convenience, but we could reset.
            // For better UX, we reset.
            clearFileBtn.click();
        }

        sendBtn.addEventListener('click', sendToPrint);

        // ---------- 5. Owner queue & auto-print simulation ----------
        function addJobToQueue(job) {
            // remove "empty" message if present
            const emptyMsg = printQueue.querySelector('.queue-empty');
            if (emptyMsg) emptyMsg.remove();

            const jobElement = document.createElement('div');
            jobElement.className = 'print-job';
            jobElement.dataset.jobId = job.id;

            // thumbnail: if image dataUrl exists, show it; else show emoji
            let thumbContent = '';
            if (job.dataUrl && job.fileType.startsWith('image/')) {
                thumbContent = `<img src="${job.dataUrl}" alt="preview">`;
            } else {
                thumbContent = job.fileType.includes('pdf') ? '📄' : (job.fileType.startsWith('text') ? '📝' : '🖼️');
            }

            jobElement.innerHTML = `
                <div class="job-thumb">${thumbContent}</div>
                <div class="job-details">
                    <div class="job-name">${escapeHtml(job.fileName)}</div>
                    <div class="job-meta">
                        <span>${job.color === 'color' ? '🎨 color' : '⚫ bw'}</span>
                        <span>📏 ${job.size}</span>
                    </div>
                </div>
                <div class="job-status" id="status-${job.id}">queued</div>
            `;

            printQueue.prepend(jobElement); // newest on top
            // Limit queue display to 8 items
            if (printQueue.children.length > 8) {
                printQueue.removeChild(printQueue.lastChild);
            }
        }

        // simple HTML escaping
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Simulate auto-print: status changes queued -> printing -> printed
        function simulateAutoPrint(job) {
            const statusEl = document.getElementById(`status-${job.id}`);
            if (!statusEl) return;

            // after 1.2s: printing
            setTimeout(() => {
                if (statusEl) {
                    statusEl.textContent = 'printing...';
                    statusEl.classList.add('printing');
                    addLog(`🖨️ printing: ${job.fileName} (${job.color}, ${job.size})`);
                }
            }, 1000);

            // after 3s: printed
            setTimeout(() => {
                if (statusEl) {
                    statusEl.textContent = '✔ printed';
                    statusEl.classList.remove('printing');
                    statusEl.style.background = '#1e4b3e';
                    statusEl.style.color = '#b7f0d9';
                }
                addLog(`✅ printed: ${job.fileName} · copy ready at counter`);
            }, 3000);
        }

        // ---------- 6. Extra: clear file after send and disable button ----------
        // we already call clearFileBtn.click() inside sendToPrint

        // initialize: disable send initially
        sendBtn.disabled = true;

        // ---------- 7. small bonus: if the user selects a new file while previous is pending, just overwrite ----------
        // already handled by handleFileSelect

        // Also allow clicking the whole drop zone to trigger file input
        dropZone.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT') {
                fileInput.click();
            }
        });

        // prevent default drag on page
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

        // Add a welcome log
        addLog('☕ cafe print station ready · scan QR to send files');
    })();
</script>
</body>
</html>
